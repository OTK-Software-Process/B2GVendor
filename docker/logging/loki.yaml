# Grafana Loki: the separate log store (ASVS V16.4.2, V16.4.3; docs/Security.md section 13).
#
# - Only the "logging" Docker network can reach it, and the application
#   containers are not on that network: they write to stdout, Alloy ships it.
#   So the API or the worker cannot read, rewrite or delete what is stored.
# - The delete API is off (deletion_mode: disabled): stored lines are removed
#   only by the retention below, never on request.
# - The ruler evaluates the alert rules in rules/ and sends alerts to Alertmanager.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 90 days, as docs/Security.md section 8 says.
  retention_period: 2160h
  deletion_mode: disabled
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  evaluation_interval: 1m
  enable_api: false
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
