# clamd for the TOR file scan (ASVS V5.4.3; Backend/src/services/antivirus.service.ts).
# The image's defaults, plus explicit limits sized for our files.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
# The ingestion worker streams each download here (INSTREAM).
TCPSocket 3310
User clamav

# A download is capped at 100 MB (TOR_MAX_BYTES); a little headroom above that.
StreamMaxLength 110M
MaxFileSize 110M
# Total content scanned inside one archive (our own ZIP limit is 200 MB).
MaxScanSize 400M
# Something too big or too deep to scan is reported as FOUND
# (Heuristics.Limits.Exceeded), never silently passed as clean.
AlertExceedsMax yes
