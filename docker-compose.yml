services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - tor-storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy

  # Runs the actual polling (e-GP RSS + data.go.th) in its own process, on
  # its own schedule, separate from the request/response API container.
  # "Poll Now" from the API only inserts a PollJob row (see
  # src/services/pollJob.service.ts) -- this container is what claims and
  # executes it, so ingestion keeps running even if the API is redeployed
  # or briefly down, and vice versa.
  ingestion-worker:
    build:
      context: ./Backend
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ./Backend/.env
    volumes:
      - tor-storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./B2GVendor
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    env_file:
      - ./B2GVendor/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
  tor-storage:
