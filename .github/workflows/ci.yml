# CI for the B2G Vendor monorepo: runs on every pull request and on every push
# to main.
#
#   backend   -- typecheck + the whole test suite (`npm test` runs every
#                check:* script) against a throwaway MongoDB service container,
#                with SMTP_HOST empty so no real email can go out
#   frontend  -- eslint, tsc, next build
#   dependencies -- per app: `npm audit` fails the build on any known high or
#                critical advisory (fix windows: docs/Security.md section 11),
#                and a CycloneDX SBOM of everything installed is kept as a
#                build artifact for 90 days (every push to main is a release)
#   ci-ok     -- one status that is green only when all jobs are: make THIS
#                the required check in the branch protection rule for main
#                (Settings -> Branches), so a failing PR can't be merged
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, so an advisory published for a dependency we already ship is noticed
  # even when nobody opens a pull request.
  schedule:
    - cron: '0 1 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # tests/run-all.ts gives every check its own database on this server.
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same major as the production images (Backend/Dockerfile)
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: B2GVendor
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same major as the production image (B2GVendor/Dockerfile)
          cache: npm
          cache-dependency-path: B2GVendor/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts is generated (and git-ignored): create it before tsc.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  dependencies:
    name: Dependencies (audit + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [Backend, B2GVendor]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      # Install scripts are not needed to list or audit what is installed.
      - run: npm ci --ignore-scripts
      # ASVS V15.1.1 / V15.2.1: a known high or critical advisory fails the build.
      # Moderate and low ones are printed and fixed within their windows.
      - run: npm audit --audit-level=high
      # ASVS V15.1.2: the bill of materials of this build (CycloneDX JSON).
      - run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom-${{ matrix.app }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: ${{ matrix.app }}/sbom-${{ matrix.app }}.cdx.json
          retention-days: 90

  ci-ok:
    name: CI passed
    if: always()
    needs: [backend, frontend, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo "backend: ${{ needs.backend.result }}, frontend: ${{ needs.frontend.result }}, dependencies: ${{ needs.dependencies.result }}"
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.dependencies.result }}" = success
